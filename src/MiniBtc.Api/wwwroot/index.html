<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mini-bitcoin · Node Explorer</title>
  <meta name="description" content="Explorer for the mini-bitcoin regtest node: blocks, transactions, mempool and parity with Bitcoin Core.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint, so a dark-theme user never sees a white flash.
    try { const t = localStorage.getItem("minibtc.theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="mini-bitcoin home">
        <span class="brand-mark">₿</span>
        <span><div class="brand-name">mini-bitcoin</div><div class="brand-sub">Node explorer</div></span>
      </a>
      <nav class="nav" id="nav">
        <div class="nav-section">Chain</div>
        <a href="#/" data-route="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</a>
        <a href="#/blocks" data-route="blocks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>Blocks</a>
        <a href="#/mempool" data-route="mempool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Mempool</a>
        <div class="nav-section">Try it</div>
        <a href="#/wallet" data-route="wallet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15v13H5a2 2 0 0 1-2-2V5"/><path d="M16 13h.01"/></svg>Wallet</a>
        <div class="nav-section">Operations</div>
        <a href="#/parity" data-route="parity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>Parity</a>
        <a href="#/broadcast" data-route="broadcast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4 20-7z"/><path d="M22 2 11 13"/></svg>Broadcast</a>
        <div class="nav-section">Project</div>
        <a href="#/architecture" data-route="architecture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="6" rx="1"/><rect x="14" y="3" width="7" height="6" rx="1"/><rect x="8.5" y="15" width="7" height="6" rx="1"/><path d="M6.5 9v3h11V9M12 12v3"/></svg>Architecture</a>
      </nav>
      <div class="sidebar-footer">
        <div>Network <strong id="footer-network">regtest</strong></div>
        <div>Node tip <strong id="footer-tip">—</strong></div>
        <div>Core tip <strong id="footer-core">—</strong></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <form class="search" id="search" role="search" autocomplete="off">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search-input" type="search" placeholder="Search by block height, block hash, txid or address" aria-label="Search">
        </form>
        <div class="topbar-right">
          <span class="pill hide-sm" id="sync-pill" title="Our tip against Core's"><span class="dot"></span><span>Sync</span></span>
          <span class="pill" id="live-pill" title="Live updates over SignalR"><span class="dot"></span><span>Connecting</span></span>
          <button class="btn icon ghost" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="lib/signalr/signalr.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
